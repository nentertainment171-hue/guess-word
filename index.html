<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guess the word</title>
<style>
:root{--bg:#e9f1f4;--card:#fff;--ink:#15303d;--mute:#5b7480;--line:#c9d8df;--tile:#f3f8fa;--accent:#f0a82b;--accent-ink:#2a1c00;--hit:#2a8a63;--miss:#c4533b;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#13222a;--card:#1b2f39;--ink:#e6f0f3;--mute:#92aab5;--line:#2e4856;--tile:#223a46;--hit:#4cc08f;--miss:#e8836d;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Avenir Next","Segoe UI",Roboto,sans-serif;line-height:1.45}
.app{max-width:520px;margin:0 auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px}
h1{font-family:Georgia,serif;font-size:1.8rem;margin:0}
h2{font-size:1.15rem;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px}
.mute{color:var(--mute);font-size:.9rem;margin:10px 0 0}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 18px;font-size:1rem;font-weight:700;cursor:pointer}
.btn.s{background:transparent;color:var(--mute);border:1px solid var(--line);padding:6px 12px;font-size:.85rem;font-weight:400}
button:focus-visible,input:focus-visible{outline:3px solid var(--hit);outline-offset:2px}
input{width:100%;font-size:1.1rem;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--tile);color:var(--ink)}
.row{display:flex;gap:10px;align-items:center}
.err{color:var(--miss);font-weight:700;min-height:1.4em;margin-top:8px;overflow-wrap:anywhere}
.code{font:700 2rem Georgia,serif;letter-spacing:6px;text-align:center;margin:10px 0}
.turn{font-weight:700;margin-bottom:10px}
.boxes{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));gap:clamp(2px,1.2vw,8px);max-width:calc(var(--n,5)*58px);margin:6px auto 16px}
.box{aspect-ratio:3/4;min-width:0;border:clamp(1px,.5vw,2px) solid var(--line);background:var(--tile);border-radius:clamp(3px,1vw,8px);display:grid;place-items:center;font:700 clamp(.65rem,calc(62vw / var(--n,5)),1.8rem) Georgia,serif}
.box.f{border-color:var(--hit);color:var(--hit)}
.label{font-size:.85rem;color:var(--mute)}
.alpha{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:10px}
.alpha button{padding:10px 0;font-size:1rem;font-weight:700;border:1px solid var(--line);background:var(--tile);color:var(--ink);border-radius:8px;cursor:pointer}
.alpha button:disabled{cursor:default;opacity:.45}
.alpha button.hit{background:var(--hit);color:#fff;border-color:var(--hit);opacity:1}
.alpha button.miss{color:var(--miss);text-decoration:line-through}
#msg{min-height:1.5em;font-weight:700}
#log{font-size:.88rem;color:var(--mute);margin:6px 0 0;padding-left:18px}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.res{margin-top:10px;font-weight:800;font-size:1.1rem}
.win{color:var(--hit)}.bad{color:var(--miss)}
.coin{width:90px;height:90px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 2rem Georgia,serif;margin:6px auto 14px}
.coin.spin{animation:flip 1.4s ease-out forwards}
@keyframes flip{to{transform:rotateY(1080deg)}}
@media (prefers-reduced-motion:reduce){.coin.spin{animation:none}}
.secret{background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:8px 12px;text-align:center;margin-bottom:12px}
.secret .label{color:var(--accent-ink);font-weight:700;letter-spacing:1.5px;font-size:.7rem}
.sw{font:700 1.5rem Georgia,serif;letter-spacing:3px;overflow-wrap:anywhere}
.banner{font:800 2.2rem Georgia,serif;text-align:center;margin:6px 0 12px;animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
@media (prefers-reduced-motion:reduce){.banner{animation:none}}
.gcard{display:block;width:100%;text-align:left;background:var(--tile);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:10px;cursor:pointer;color:var(--ink);font:inherit}
.gcard .gt{display:block;font:700 1.25rem Georgia,serif}.gcard .gd{display:block;color:var(--mute);font-size:.9rem;margin-top:2px}
.sboxes{--bs:min(40px,calc((min(100vw,520px) - 80px)/var(--ml,6) - 4px));display:flex;flex-wrap:wrap;justify-content:center;gap:10px 16px;margin:6px 0 16px}
.wg{display:flex;gap:4px}
.sbox{width:var(--bs);height:calc(var(--bs)*1.25);border:max(1px,calc(var(--bs)*.06)) solid var(--line);background:var(--tile);border-radius:4px;display:grid;place-items:center;font:700 calc(var(--bs)*.55) Georgia,serif}
.sbox.f{border-color:var(--hit);color:var(--hit)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding-top:env(safe-area-inset-top,0px)}
.sheet{background:var(--card);color:var(--ink);width:100%;max-width:520px;max-height:85vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.btn.s.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
ol.h{padding-left:20px;margin:0}ol.h li{margin-bottom:10px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="app">
<div class="top"><h1>Guess the word</h1><div class="row"><span id="who" class="label"></span><button class="btn s" id="homeBtn" hidden>Home</button><button class="btn s" id="how" hidden>How to play the game</button><button class="btn s" id="out" hidden>Sign out</button></div></div>

<section id="login" class="card" hidden>
<h2>Sign in to play with a friend</h2>
<button class="btn" id="g">Continue with Google</button>
<hr>
<label class="label" for="gname">or play as a guest</label>
<div class="row" style="margin-top:6px;flex-wrap:wrap"><input id="gname" maxlength="15" autocomplete="off" placeholder="Your username" style="flex:1 1 150px;width:auto"><button class="btn" id="guest">Continue as Guest</button></div>
<div class="err" id="gerr"></div>
</section>

<section id="homeScreen" class="card" hidden>
<h2>Choose a game</h2>
<button class="gcard" id="cw"><span class="gt">Guess the Word</span><span class="gd">Guess your friend’s secret word</span></button>
<button class="gcard" id="cs"><span class="gt">Guess the Sentence</span><span class="gd">Guess your friend’s secret sentence</span></button>
</section>

<section id="lobby" class="card" hidden>
<h2 id="lt">Play with a friend</h2>
<button class="btn" id="create">Create a room</button>
<hr>
<label class="label" for="code">or enter your friend’s room code</label>
<div class="row" style="margin-top:6px"><input id="code" maxlength="5" autocomplete="off" autocapitalize="characters"><button class="btn" id="join">Join</button></div>
<div class="err" id="lerr"></div>
</section>

<section id="wait" class="card" hidden>
<h2 id="wt"></h2>
<div class="code" id="rc"></div>
<p class="mute" id="wp"></p>
<button class="btn s" id="leave1" style="margin-top:12px">Leave room</button>
</section>

<section id="word" class="card" hidden>
<h2 id="wh">Type your word</h2>
<div class="row"><input id="w" maxlength="20" autocomplete="off" autocapitalize="characters" aria-label="Your secret word"><button class="btn" id="done">Done</button></div>
<div class="err" id="werr"></div>
<p class="mute">Only you can see your word. Your friend sees just the number of letters.</p>
</section>

<section id="toss" class="card" hidden style="text-align:center">
<h2>Toss: who asks first?</h2>
<div class="coin" id="coin">?</div>
<p class="turn" id="tossres"></p>
<button class="btn" id="start" hidden>Start game</button>
</section>

<section id="game" class="card" hidden>
<div class="secret" id="secret" hidden><div class="label">YOUR SECRET WORD</div><div class="sw" id="sw"></div></div>
<div class="banner" id="banner" hidden></div>
<div class="turn" id="turn"></div>
<div class="label" id="oplabel" style="text-align:center"></div>
<div class="boxes" id="boxes"></div>
<label id="gl" for="guess" class="label" style="display:block;margin-bottom:6px">type here your guessed word</label>
<div class="row"><input id="guess" autocomplete="off" autocapitalize="characters"><button class="btn" id="sub">Submit</button></div>
<div class="res" id="res" aria-live="polite"></div>
<button class="btn" id="again" hidden style="margin-top:12px">Play again</button>
<hr>
<h2>guess a letter of your opponent</h2>
<div class="alpha" id="alpha"></div>
<div id="msg" aria-live="polite"></div>
<ul id="log"></ul>
<button class="btn s" id="leave2" style="margin-top:14px">Leave room</button>
</section>
</div>

<div id="help" class="ov" hidden role="dialog" aria-modal="true" aria-labelledby="ht">
<div class="sheet">
<div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 id="ht" style="margin:0">How to play the game</h2><button class="btn s" id="hx">Close</button></div>
<div class="row" style="margin-bottom:8px"><button class="btn s" id="tw">Guess the Word</button><button class="btn s" id="ts">Guess the Sentence</button></div>
<div class="row" style="margin-bottom:12px"><button class="btn s" id="lb">বাংলা</button><button class="btn s" id="le">English</button></div>
<div id="hb"></div>
</div>
</div>

<canvas id="cf" hidden></canvas>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut,signInAnonymously,updateProfile} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,setDoc,getDoc,updateDoc,onSnapshot,collection,addDoc,arrayUnion,deleteField} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyC1CAYNrfpK2zcP_gXhpA2sLBFHhDiGfxE",
  authDomain:"guess-the-word-58846.firebaseapp.com",
  projectId:"guess-the-word-58846",
  storageBucket:"guess-the-word-58846.firebasestorage.app",
  messagingSenderId:"628965615041",
  appId:"1:628965615041:web:066bac8bb143b38778bb40"
});
const auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s);
const ALPHA="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
let me=null,code=null,room=null,moves=[],unR=null,unM=null,myWord="",started=false,tossShown=false,round=null,lastTurn=false;
const busy=new Set();

function show(id){["login","homeScreen","lobby","wait","word","toss","game"].forEach(s=>$("#"+s).hidden=s!==id)}
function ord(n){const s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function say(l,p){return p.length?"Yes, there is a "+l+" in "+p.map(ord).join(", ")+(p.length>1?" positions":" position"):"There is no \u201C"+l+"\u201D"}
const nm=u=>((u&&u.displayName)||localStorage.getItem("gtw-guest-name")||(u&&u.isAnonymous?"Guest":"Player")).split(" ")[0];
const roomRef=()=>doc(db,"rooms",code);
const curMoves=()=>moves.filter(m=>(m.r||0)===((room&&room.round)||0));
const wk=()=>"gtw-word-"+code+"-"+((room&&room.round)||0);
const sk=()=>"gtw-started-"+code+"-"+((room&&room.round)||0);
const movesRef=()=>collection(db,"rooms",code,"moves");

$("#g").onclick=async()=>{
  try{await signInWithPopup(auth,new GoogleAuthProvider())}
  catch(e){console.error("Google Sign-In Error:",e);$("#gerr").textContent="Sign-in failed: "+e.code+" | "+e.message+" | site: "+location.hostname}
};
function openLobby(m){
  lmode=m;$("#lt").textContent="Play "+(m==="word"?"Guess the Word":"Guess the Sentence")+" with a friend";
  $("#lerr").textContent="";show("lobby");
}
$("#cw").onclick=()=>openLobby("word");$("#cs").onclick=()=>openLobby("sentence");
$("#guest").onclick=async()=>{
  const n=$("#gname").value.trim();
  if(!/^[\p{L}\p{M}\p{N}_-]{2,15}$/u.test(n)){$("#gerr").textContent="Use 2 to 15 letters or numbers, no spaces.";return}
  try{
    const c=await signInAnonymously(auth);
    await updateProfile(c.user,{displayName:n});
    localStorage.setItem("gtw-guest-name",n);
    $("#who").textContent=n;
  }catch(e){console.error("Guest Sign-In Error:",e);$("#gerr").textContent="Guest sign-in failed: "+e.code}
};
$("#out").onclick=()=>{
  if(me&&me.isAnonymous&&!confirm("A guest session cannot be recovered after signing out. Sign out anyway?"))return;
  leave();signOut(auth);
};
onAuthStateChanged(auth,u=>{
  me=u;$("#out").hidden=!u;$("#how").hidden=!u;$("#homeBtn").hidden=!u;$("#who").textContent=u?nm(u):"";
  if(!u){show("login");return}
  const saved=localStorage.getItem("gtw-room");
  if(saved)enter(saved);else show("homeScreen");
});

$("#create").onclick=async()=>{
  try{
    let c;
    for(;;){
      c=Array.from({length:5},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ"[Math.random()*24|0]).join("");
      if(!(await getDoc(doc(db,"rooms",c))).exists())break;
    }
    await setDoc(doc(db,"rooms",c),{host:me.uid,players:[me.uid],names:{[me.uid]:nm(me)},len:{},mode:lmode,t:Date.now()});
    enter(c);
  }catch(e){console.error("Create room error:",e);$("#lerr").textContent="Could not create the room: "+e.code}
};
$("#join").onclick=async()=>{
  const c=$("#code").value.trim().toUpperCase();if(!c)return;
  try{
    const s=await getDoc(doc(db,"rooms",c));
    if(!s.exists()){$("#lerr").textContent="Room not found";return}
    const d=s.data();
    if((d.mode||"word")!==lmode){$("#lerr").textContent="This room is for "+((d.mode||"word")==="word"?"Guess the Word":"Guess the Sentence")+". Go to Home and pick that game.";return}
    if(!d.players.includes(me.uid)){
      if(d.players.length>=2){$("#lerr").textContent="Room is full";return}
      await updateDoc(doc(db,"rooms",c),{players:arrayUnion(me.uid),["names."+me.uid]:nm(me)});
    }
    enter(c);
  }catch(e){console.error("Join room error:",e);$("#lerr").textContent="Could not join the room: "+e.code}
};

function enter(c){
  if(unR)unR();if(unM)unM();
  code=c;room=null;moves=[];localStorage.setItem("gtw-room",c);
  myWord="";started=false;tossShown=false;round=null;lastTurn=false;
  unR=onSnapshot(roomRef(),s=>{
    if(!s.exists()){leave();return}
    room=s.data();
    {const r=room.round||0;if(r!==round){round=r;myWord=localStorage.getItem(wk())||"";started=!!localStorage.getItem(sk());tossShown=false;$("#w").value="";$("#werr").textContent="";$("#guess").value=""}}
    {const tn=room.turn;if(lastTurn&&lastTurn!==me.uid&&tn===me.uid&&!room.winner&&started)ting();lastTurn=tn}
    const opp=room.players.find(p=>p!==me.uid);
    if(room.host===me.uid&&opp&&room.len[me.uid]&&room.len[opp]&&!room.first){
      const f=Math.random()<.5?me.uid:opp;
      updateDoc(roomRef(),{first:f,turn:f});
    }
    render();
  },()=>leave());
  unM=onSnapshot(movesRef(),s=>{
    moves=s.docs.map(d=>({ref:d.ref,id:d.id,...d.data()})).sort((a,b)=>a.t-b.t);
    answer();render();
  });
}
function leave(){
  if(unR)unR();if(unM)unM();unR=unM=null;
  localStorage.removeItem("gtw-room");code=null;room=null;moves=[];
  if(me)show("homeScreen");
}
$("#start").onclick=()=>{started=true;localStorage.setItem(sk(),"1");render();if(room&&room.turn===me.uid)ting()};
$("#again").onclick=async()=>{
  if(!room||!room.winner)return;
  try{await updateDoc(roomRef(),{round:(room.round||0)+1,len:{},first:deleteField(),turn:deleteField(),winner:deleteField()})}
  catch(e){console.error("Play again error:",e)}
};
$("#homeBtn").onclick=()=>{
  if(!code){show("homeScreen");return}
  if(room&&room.first&&!room.winner&&!confirm("Leave this game?"))return;
  leave();
};
$("#leave1").onclick=leave;$("#leave2").onclick=leave;

$("#done").onclick=async()=>{
  const sm=room&&room.mode==="sentence";
  const v=$("#w").value.trim().toUpperCase().replace(/\s+/g," ");
  if(sm){
    if(v.length>200){$("#werr").textContent="Your sentence is too long. The maximum is 200 characters.";return}
    if(!/^[A-Z]+( [A-Z]+)*$/.test(v)||v.replace(/ /g,"").length<3){$("#werr").textContent="Use at least 3 letters, A to Z and single spaces only.";return}
    myWord=v;localStorage.setItem(wk(),v);
    await updateDoc(roomRef(),{["len."+me.uid]:v.replace(/ /g,"").length,["shape."+me.uid]:v.split(" ").map(w=>w.length)});
    return;
  }
  if(v.length>20){$("#werr").textContent="Your word is too long. The maximum is 20 letters.";return}
  if(!/^[A-Z]{3,20}$/.test(v)){$("#werr").textContent="Use 3 to 20 letters, A to Z only.";return}
  myWord=v;localStorage.setItem(wk(),v);
  await updateDoc(roomRef(),{["len."+me.uid]:v.length});
};

// My browser answers my friend's questions about my secret word.
let lmode="word";
let ac=null;
function audio(){
  if(!ac){const A=window.AudioContext||window.webkitAudioContext;if(A)ac=new A()}
  if(ac&&ac.state==="suspended")ac.resume();
  return ac;
}
document.addEventListener("pointerdown",audio);
function tone(a,at,f,g,d,type){
  const o=a.createOscillator(),n=a.createGain();
  o.type=type;o.frequency.value=f;
  n.gain.setValueAtTime(0.0001,at);n.gain.linearRampToValueAtTime(g,at+.005);n.gain.exponentialRampToValueAtTime(.0001,at+d);
  o.connect(n);n.connect(a.destination);o.start(at);o.stop(at+d+.02);
}
function ting(){
  const a=audio();if(!a||a.state!=="running")return;
  const t=a.currentTime;
  tone(a,t,1318.5,.3,1.2,"sine");tone(a,t,1976,.12,.9,"sine");tone(a,t,2637,.06,.6,"sine");
}
function coin(){
  const a=audio();if(!a||a.state!=="running")return;
  const t=a.currentTime;let at=t,gap=.13;
  while(at<t+1.4){tone(a,at,3200+Math.random()*500,.07,.07,"triangle");gap=Math.max(.045,gap*.93);at+=gap}
  tone(a,t+1.5,2400,.22,.35,"triangle");tone(a,t+1.5,3600,.12,.25,"triangle");tone(a,t+1.62,2900,.1,.2,"triangle");
}
function noise(a,at,d,g,type,f,q){
  const len=Math.max(1,a.sampleRate*d|0),b=a.createBuffer(1,len,a.sampleRate),ch=b.getChannelData(0);
  for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;
  const s=a.createBufferSource(),fl=a.createBiquadFilter(),n=a.createGain();
  s.buffer=b;fl.type=type;fl.frequency.value=f;fl.Q.value=q||1;
  n.gain.setValueAtTime(g,at);n.gain.exponentialRampToValueAtTime(.0001,at+d);
  s.connect(fl);fl.connect(n);n.connect(a.destination);s.start(at);
}
function pop(){
  const a=audio();if(!a||a.state!=="running")return;
  const t=a.currentTime;
  noise(a,t,.14,.9,"lowpass",2200,.7);
  const o=a.createOscillator(),n=a.createGain();
  o.frequency.setValueAtTime(240,t);o.frequency.exponentialRampToValueAtTime(50,t+.12);
  n.gain.setValueAtTime(.7,t);n.gain.exponentialRampToValueAtTime(.0001,t+.15);
  o.connect(n);n.connect(a.destination);o.start(t);o.stop(t+.16);
  noise(a,t+.02,2.6,.18,"highpass",4500,.5);
  for(let i=0;i<46;i++){noise(a,t+.08+Math.pow(Math.random(),1.6)*2.6,.03,.12,"bandpass",2500+Math.random()*3500,3)}
}
function lose(){
  const a=audio();if(!a||a.state!=="running")return;
  const t=a.currentTime;
  [[330,0],[311,.3],[294,.6]].forEach(([f,d])=>tone(a,t+d,f,.18,.28,"triangle"));
  const o=a.createOscillator(),n=a.createGain(),fl=a.createBiquadFilter();
  fl.type="lowpass";fl.frequency.value=900;o.type="sawtooth";
  o.frequency.setValueAtTime(277,t+.9);o.frequency.exponentialRampToValueAtTime(185,t+1.9);
  n.gain.setValueAtTime(.0001,t+.9);n.gain.linearRampToValueAtTime(.2,t+.95);n.gain.exponentialRampToValueAtTime(.0001,t+1.95);
  o.connect(fl);fl.connect(n);n.connect(a.destination);o.start(t+.9);o.stop(t+2);
}
function confetti(){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=$("#cf"),x=c.getContext("2d");
  c.width=innerWidth;c.height=innerHeight;c.hidden=false;
  const cols=["#f0a82b","#2a8a63","#c4533b","#3b82c4","#a855c7","#f2d03b"];
  const P=Array.from({length:110},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.6,w:5+Math.random()*7,h:8+Math.random()*10,vy:2+Math.random()*3.5,vx:-1+Math.random()*2,a:Math.random()*6.28,va:-.2+Math.random()*.4,col:cols[Math.random()*cols.length|0]}));
  const t0=performance.now();
  (function f(t){
    const e=t-t0;x.clearRect(0,0,c.width,c.height);

      p.x+=p.vx;p.y+=p.vy;p.a+=p.va;

      x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.col;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore();
    });

  })(t0);
}

function answer(){
  if(!myWord||!code||!room)return;
  curMoves().forEach(async m=>{
    if(m.by===me.uid||m.answer||busy.has(m.id))return;
    busy.add(m.id);
    try{
      if(m.kind==="letter"){
        const pos=[];[...myWord.replace(/ /g,"")].forEach((c,i)=>{if(c===m.value)pos.push(i+1)});
        await updateDoc(m.ref,{answer:{pos}});
        await updateDoc(roomRef(),{turn:me.uid});
      }else{
        const ok=m.value.replace(/\s+/g," ").trim()===myWord;
        await updateDoc(m.ref,{answer:{ok}});
        if(ok)await updateDoc(roomRef(),{winner:m.by});
      }
    }catch(e){busy.delete(m.id)}
  });
}

function render(){
  if(!room||!me)return;
  const opp=room.players.find(p=>p!==me.uid);
  $("#rc").textContent="";
  if(!opp){
    $("#wt").textContent="Waiting for your friend\u2026";$("#rc").textContent=code;
    $("#wp").textContent="Send this room code to your friend. They tap Join and enter it.";show("wait");return;
  }
  if(!room.len[me.uid]){
    const sm=room.mode==="sentence";
    $("#wh").textContent=sm?"Type your sentence":"Type your word";$("#w").maxLength=sm?200:20;
    $("#w").placeholder=sm?"up to 200 characters":"";show("word");return;
  }
  if(!room.len[opp]){
    $("#wt").textContent="Waiting for your friend to type their word\u2026";$("#wp").textContent="";show("wait");return;
  }
  if(!room.first){
    $("#wt").textContent="Tossing the coin\u2026";$("#wp").textContent="";show("wait");return;
  }
  if(!started){
    show("toss");
    if(!tossShown){
      tossShown=true;
      const c=$("#coin");c.textContent="?";$("#tossres").textContent="";$("#start").hidden=true;
      c.classList.remove("spin");void c.offsetWidth;c.classList.add("spin");coin();
      setTimeout(()=>{
        const win=room&&room.first===me.uid;
        c.textContent=win?"Y":"F";
        $("#tossres").textContent=win?"You won the toss. You ask first.":"Your friend won the toss and asks first.";
        $("#start").hidden=false;
      },1500);
    }
    return;
  }
  show("game");
  const mine=curMoves().filter(m=>m.by===me.uid),theirs=curMoves().filter(m=>m.by!==me.uid);
  const n=room.len[opp],rev=Array(n).fill(""),used=new Set();
  mine.forEach(m=>{if(m.kind==="letter"){used.add(m.value);(m.answer?.pos||[]).forEach(p=>rev[p-1]=m.value)}});
  const pending=mine.some(m=>m.kind==="letter"&&!m.answer);
  const over=!!room.winner;
  $("#again").hidden=!over;$("#banner").hidden=!over;
  $("#secret").hidden=over||!myWord;$("#sw").textContent=myWord;
  {const sm2=room.mode==="sentence";
   document.querySelector("#secret .label").textContent=sm2?"YOUR SECRET SENTENCE":"YOUR SECRET WORD";
   $("#sw").style.fontSize=myWord.length>40?".95rem":"";
   $("#gl").textContent=sm2?"type here your guessed sentence":"type here your guessed word";
   $("#guess").maxLength=sm2?200:30}
  $("#oplabel").textContent=(room.names?.[opp]||"Your friend")+"\u2019s "+(room.mode==="sentence"?"sentence":"word")+" \u00B7 "+n+" letters";
  if(room.mode==="sentence"){
    const sh=(room.shape&&room.shape[opp])||[n];let k=0;
    $("#boxes").className="sboxes";$("#boxes").style.setProperty("--ml",Math.max(...sh));
    $("#boxes").innerHTML=sh.map(len=>'<div class="wg">'+rev.slice(k,k+=len).map(l=>'<div class="sbox'+(l?" f":"")+'">'+l+"</div>").join("")+"</div>").join("");
  }else{$("#boxes").className="boxes";$("#boxes").style.setProperty("--n",n);$("#boxes").innerHTML=rev.map(l=>'<div class="box'+(l?" f":"")+'">'+l+"</div>").join("")}
  $("#alpha").innerHTML="";
  ALPHA.forEach(l=>{
    const b=document.createElement("button");b.textContent=l;
    const hit=used.has(l)&&rev.includes(l);
    if(used.has(l))b.className=hit?"hit":"miss";
    b.disabled=over||pending||room.turn!==me.uid||used.has(l);
    b.onclick=()=>pick(l);$("#alpha").appendChild(b);
  });
  const lm=[...mine].reverse().find(m=>m.kind==="letter"&&m.answer);
  $("#msg").textContent=lm?say(lm.value,lm.answer.pos):"";
  const lw=[...mine].reverse().find(m=>m.kind==="word"&&m.answer);
  const r=$("#res");
  if(over){
    const w=room.winner===me.uid;
    r.textContent="";r.className="res";
    $("#banner").className="banner "+(w?"win":"bad");$("#banner").textContent=w?"🏆 YOU WIN!":"GAME OVER!";
    const ck="gtw-cel-"+code+"-"+(room.round||0);
    if(!localStorage.getItem(ck)){localStorage.setItem(ck,"1");if(w){confetti();pop()}else lose()}
  }else if(lw){r.textContent=lw.answer.ok?"You win":"Wrong ans";r.className="res "+(lw.answer.ok?"win":"bad")}
  else{r.textContent="";r.className="res"}
  $("#turn").textContent=over?"Game over":pending?"Waiting for the answer\u2026":room.turn===me.uid?"Your turn: pick a letter":"Your friend\u2019s turn\u2026";
  $("#log").innerHTML=[...theirs].reverse().filter(m=>m.kind==="letter"&&m.answer)
    .map(m=>"<li>Friend asked \u201C"+m.value+"\u201D about your word: "+say(m.value,m.answer.pos)+"</li>").join("");
}

async function pick(l){
  if(!room||room.winner||room.turn!==me.uid)return;
  if(curMoves().some(m=>m.by===me.uid&&m.kind==="letter"&&(m.value===l||!m.answer)))return;
  await addDoc(movesRef(),{by:me.uid,kind:"letter",value:l,r:room.round||0,t:Date.now(),answer:null});
}
$("#sub").onclick=async()=>{
  const v=$("#guess").value.trim().toUpperCase();
  if(!v||!room||room.winner)return;
  $("#guess").value="";
  await addDoc(movesRef(),{by:me.uid,kind:"word",value:v,r:room.round||0,t:Date.now(),answer:null});
};
$("#guess").addEventListener("keydown",e=>{if(e.key==="Enter")$("#sub").click()});
</script>
